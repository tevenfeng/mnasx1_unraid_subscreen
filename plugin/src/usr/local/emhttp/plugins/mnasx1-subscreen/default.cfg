; Defaults for mnasx1-subscreen. The settings page merges these with the
; user's /boot/config/plugins/mnasx1-subscreen/mnasx1-subscreen.cfg.
pace=1.5
every_fast=1
every_medium=2
every_slow=4
every_static=12
layout=per-page
syscount=auto
card_order=cpu,igpu,mem,dgpu
wlan_slots=3
wlan_total_unit=auto
system_mode=both
disks=
ifaces=
gpu=1
gpu_igpu=1
gpu_dgpu=1
nvidia_smi=1
temp_hwmon=1
temp_smartctl=1
temp_disksini=1
wake_disks=0
allow_hibernate=0
log_verbose=0
